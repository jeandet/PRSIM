name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Ubuntu's apt meson (1.3) is too old for meson_version >= 1.5 and its default GCC (13)
# predates -std=c++26, so meson/ninja come from pip and the compiler from g++-14.
env:
  CC: gcc-14
  CXX: g++-14

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 pkg-config libfreetype-dev libharfbuzz-dev \
            libudev-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl-dev libdrm-dev libgbm-dev \
            libdbus-1-dev libasound2-dev libpulse-dev libibus-1.0-dev libpipewire-0.3-dev libwayland-bin xvfb
          pip install 'meson>=1.5' ninja meson-python nanobind pytest pydantic
      - name: Setup builddir
        run: meson setup builddir -Dmagic_enum:test=false -Dsdl3:werror=false -Dsdl3:warning_level=0
      - name: Build
        run: ninja -C builddir
      - name: Run tests (C++ + Python via meson test)
        run: xvfb-run -a meson test -C builddir --print-errorlogs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-testlog-build-and-test
          path: builddir/meson-logs/testlog.txt

  tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 pkg-config libfreetype-dev libharfbuzz-dev \
            libudev-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl-dev libdrm-dev libgbm-dev \
            libdbus-1-dev libasound2-dev libpulse-dev libibus-1.0-dev libpipewire-0.3-dev libwayland-bin xvfb
          pip install 'meson>=1.5' ninja meson-python nanobind pytest pydantic
      - name: Setup TSan builddir
        run: meson setup builddir-tsan -Dmagic_enum:test=false -Dsdl3:werror=false -Dsdl3:warning_level=0 -Db_sanitize=thread -Dbuildtype=debugoptimized
      - name: Build TSan
        run: ninja -C builddir-tsan
      - name: Run TSan tests (C++ + Python via meson test, SDL flaky suites excluded)
        run: xvfb-run -a meson test -C builddir-tsan --print-errorlogs --exclude python_bindings --exclude sdl_window --exclude model_app --exclude model_app_chrome_cursor --exclude software_backend_chrome_cursor --exclude app --exclude software_backend_request_window
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-testlog-tsan
          path: builddir-tsan/meson-logs/testlog.txt

  asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 pkg-config libfreetype-dev libharfbuzz-dev \
            libudev-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl-dev libdrm-dev libgbm-dev \
            libdbus-1-dev libasound2-dev libpulse-dev libibus-1.0-dev libpipewire-0.3-dev libwayland-bin xvfb
          pip install 'meson>=1.5' ninja meson-python nanobind pytest pydantic
      - name: Setup ASan+UBSan builddir
        run: meson setup builddir-asan -Dmagic_enum:test=false -Dsdl3:werror=false -Dsdl3:warning_level=0 -Db_sanitize=address,undefined -Dbuildtype=debugoptimized
      - name: Build ASan+UBSan
        run: ninja -C builddir-asan
      - name: Run ASan+UBSan tests (C++ + Python via meson test, SDL flaky suites excluded)
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: xvfb-run -a meson test -C builddir-asan --print-errorlogs --exclude sdl_window --exclude model_app --exclude model_app_chrome_cursor --exclude software_backend_chrome_cursor --exclude app --exclude software_backend_request_window
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-testlog-asan
          path: builddir-asan/meson-logs/testlog.txt

  free-threaded:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14t'
          allow-prereleases: true
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 pkg-config libfreetype-dev libharfbuzz-dev \
            libudev-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl-dev libdrm-dev libgbm-dev \
            libdbus-1-dev libasound2-dev libpulse-dev libibus-1.0-dev libpipewire-0.3-dev libwayland-bin xvfb
          pip install 'meson>=1.5' ninja meson-python nanobind pytest pydantic
      - name: Setup builddir
        run: meson setup builddir-ft -Dmagic_enum:test=false -Dsdl3:werror=false -Dsdl3:warning_level=0
      - name: Build
        run: ninja -C builddir-ft
      - name: Run tests (C++ + Python via meson test, free-threaded)
        run: xvfb-run -a meson test -C builddir-ft --print-errorlogs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-testlog-free-threaded
          path: builddir-ft/meson-logs/testlog.txt

  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Homebrew GCC for cibuildwheel (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          GXX=$(ls $(brew --prefix)/bin/g++-1[0-9] | sort -V | tail -1)
          echo "CIBW_ENVIRONMENT=CC=clang CXX=$GXX MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.1.3
        env:
          # full matrix on tags, one interpreter otherwise (every wheel rebuilds SDL3 from source)
          CIBW_BUILD: ${{ github.ref_type == 'tag' && '*' || 'cp313-*' }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps (meson-python configures the tree to run `meson dist`)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 pkg-config libfreetype-dev libharfbuzz-dev \
            libudev-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl-dev libdrm-dev libgbm-dev \
            libdbus-1-dev libasound2-dev libpulse-dev libibus-1.0-dev libpipewire-0.3-dev libwayland-bin xvfb
      - run: pip install build && python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Mirrors the maintainer's macOS setup (Homebrew GCC for C++, Apple clang for C, shared libstdc++); would have
  # caught the "pointer being freed was not allocated" import crash of dc757b3.
  macos-gcc:
    runs-on: macos-latest
    env:
      CC: ''
      CXX: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          brew install gcc meson ninja pkg-config freetype harfbuzz
          pip install meson-python nanobind pytest pydantic
      - name: Setup builddir (newest Homebrew GCC)
        run: |
          # SDL3 (C) must be built with Apple clang: the SDK's IOKit headers use Blocks, which GCC lacks.
          # prism (C++26) uses the newest Homebrew GCC — the maintainer's setup.
          export CXX=$(ls $(brew --prefix)/bin/g++-1[0-9] | sort -V | tail -1)
          export CC=clang
          echo "CXX=$CXX" >> "$GITHUB_ENV"; echo "CC=$CC" >> "$GITHUB_ENV"
          meson setup builddir -Dmagic_enum:test=false -Dsdl3:werror=false -Dsdl3:warning_level=0 -Dsdl3_ttf:werror=false -Dsdl3_ttf:warning_level=0
      - name: Build
        run: ninja -C builddir
      - name: Import the extension and run the Python suite
        run: |
          PYTHONPATH=builddir/python python -c "import prism; print('import ok')"
          meson test -C builddir python_bindings --print-errorlogs
