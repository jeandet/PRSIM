[build-system]
build-backend = 'mesonpy'
requires = ['meson-python>=0.14.0', 'nanobind>=2.0']

[project]
name = "prism"
description = "PRISM - Persistent Rendering & Interactive Scene Model"
authors = [{name="PRISM Contributors"}]
license = {text="MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
dynamic = ["version"]

[tool.pytest.ini_options]
pythonpath = ["builddir/python"]
addopts = "--import-mode=importlib"

[tool.meson-python.args]
setup = [
  '-Doptimization=3', '-Dcpp_std=c++26',
  '-Dtests=disabled', '-Dexamples=disabled', '-Dbenchmarks=disabled',
  # vendored deps are linked statically so the wheel only needs system freetype/harfbuzz
  '--force-fallback-for=fmt,sdl3,sdl3_ttf',
  '-Dfmt:default_library=static', '-Dsdl3:default_library=static', '-Dsdl3_ttf:default_library=static',
  '-Dsdl3:werror=false', '-Dsdl3:warning_level=0', '-Dsdl3_ttf:werror=false', '-Dsdl3_ttf:warning_level=0',
  '--vsenv',
]
install = ['--tags=runtime,python-runtime']
